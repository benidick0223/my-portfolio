<html lang="en">
<head>
    <meta charset="UTF-8">

    <style>
        :root {
            --p5-red: #D90429;
            --p5-crimson: #9B021E;
            --p5-dark: #121212;
            --p5-card-bg: #1A1A1A;
            --p5-border: #333333;
            --p5-light: #F8F9FA;
            --p5-gray: #A0A0A0;
            --p5-accent: #FFD166;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--p5-dark);
            color: var(--p5-light);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Subtle Background Texture */
        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: radial-gradient(rgba(217, 4, 4, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
            z-index: -1;
            pointer-events: none;
        }

        /* Navigation Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 2px solid var(--p5-red);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 48px;
            z-index: 1000;
        }

        .logo {
            font-family: 'Teko', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--p5-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span {
            color: var(--p5-red);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 32px;
        }

        nav a {
            color: var(--p5-gray);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--p5-light);
        }

        /* Container Layout */
        .container {
            max-width: 1100px;
            margin: 140px auto 80px auto;
            padding: 0 24px;
        }

        section {
            margin-bottom: 96px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }

        .section-title {
            font-family: 'Teko', sans-serif;
            font-size: 2.8rem;
            text-transform: uppercase;
            color: var(--p5-light);
            letter-spacing: 1px;
            line-height: 1;
        }

        .section-line {
            height: 2px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--p5-red), transparent);
        }

        /* Hero Section */
        .hero {
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 40px;
            align-items: center;
            min-height: 60vh;
        }

        .hero-content h1 {
            font-size: 3.2rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }
